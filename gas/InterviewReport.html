<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>面試學習歷程報告</title><style>body{font:16px system-ui,sans-serif;color:#17324a;background:#f3f6f8;margin:24px}main{max-width:1000px;margin:auto;background:white;padding:28px;border-radius:12px}input,button{font:inherit;padding:10px}input{max-width:90%;width:440px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccd5df;padding:10px;text-align:left;vertical-align:top}.wrap{overflow:auto}dd{margin:0 0 12px}dt{color:#526579}small{display:block;margin-top:20px} @media print{body{background:white;margin:0}main{padding:0}form,button,#status{display:none}tr{break-inside:avoid}}[hidden]{display:none!important}</style></head><body><main><h1>面試學習歷程報告</h1><p>學生同意提供的教師核章評量摘要。請配合學生證與校方資料核對身份；本報告未保存姓名，也不是完整操作時間線。</p><form id="lookup"><input id="reportId" aria-label="報告 ID" placeholder="報告 ID"><button>查驗報告</button></form><p id="status" role="status"></p><section id="report" hidden><h2>雲端簽章有效</h2><dl id="facts"></dl><div class="wrap"><table><thead><tr><th>單元／題目</th><th>初評</th><th>調整後</th><th>評量分項</th><th>核章時間</th></tr></thead><tbody id="records"></tbody></table></div><small>分項為提交時的評量資料；調整後成績包含教師調分。連結持有者可於有效期限內查看，請僅提供給預定面試者。簽章確認報告內容，持證者身份須另外核對。</small><button id="printBtn" type="button">列印／另存 PDF</button></section></main><script>
'use strict';
const $=id=>document.getElementById(id);
$('reportId').value=new URL(location.href).searchParams.get('id')||'';
function date(value){const d=new Date(value);return Number.isNaN(d.getTime())?'—':d.toLocaleString('zh-TW');}
$('lookup').onsubmit=event=>{event.preventDefault();$('report').hidden=true;$('status').textContent='查驗中…';google.script.run.withFailureHandler(()=>{$('status').textContent='暫時無法查驗，請稍後再試。';}).withSuccessHandler(result=>{if(!result||!result.valid){$('status').textContent='報告不存在、已到期或簽章不符。';return;}const r=result.report;$('facts').replaceChildren();[['報告 ID',r.reportId],['班級／座號',r.cls+'／'+r.seat],['學期',r.semester],['核發時間',date(r.issuedAt)],['有效期限',date(r.expiresAt)]].forEach(([key,value])=>{const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=key;dd.textContent=value;$('facts').append(dt,dd);});$('records').replaceChildren();r.records.forEach(item=>{const tr=document.createElement('tr');[({horn:'喇叭',start:'起動'}[item.unit]||item.unit)+'／'+(item.task||'—'),item.initialScore,item.finalScore,Object.entries(item.parts||{}).map(([key,value])=>key+'：'+value).join('；')||'未提供分項',date(item.approvedAt)].forEach(value=>{const td=document.createElement('td');td.textContent=value;tr.append(td);});$('records').append(tr);});$('report').hidden=false;$('status').textContent='查驗通過。';}).verifyInterviewReport($('reportId').value.trim());};
$('printBtn').onclick=()=>window.print();
if($('reportId').value)$('lookup').requestSubmit();
</script></body></html>
