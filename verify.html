<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>證書驗證（V2-P2）</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h2>證書驗證（V2-P2）</h2>
    <div class="status-bar"><span>用法：verify.html?id=證書ID（本機註冊表；跨裝置請接 GAS）</span></div>
    <div style="max-width:640px;background:#ecf0f1;border-radius:10px;padding:24px;">
        <div style="display:flex;gap:8px;margin-bottom:12px;">
            <input id="vid" placeholder="輸入證書ID" style="flex:1;padding:8px;">
            <button onclick="VRF.check()" style="padding:8px 16px;cursor:pointer;">查驗</button>
        </div>
        <div id="vmsg">請輸入證書ID查驗。</div>
        <p><a href="index.html">← 回學生端</a>　<a href="teacher.html">教師端 →</a></p>
    </div>
    <script>
        window.VRF = (function () {
            function find(id) {
                try {
                    var list = JSON.parse(localStorage.getItem('ntc-cert-v1') || '[]');
                    for (var i = 0; i < list.length; i++) if (list[i].certId === id) return list[i];
                } catch (e) {}
                return null;
            }
            function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
            function mask(s) {
                s = String(s == null ? '' : s);
                return s.length > 1 ? s.slice(0, 1) + '＊＊' : '＊';
            }
            function check() {
                var id = (document.getElementById('vid').value || '').trim();
                var box = document.getElementById('vmsg');
                if (!id) { box.textContent = '請輸入證書ID'; return; }
                var c = find(id);
                if (!c) { box.innerHTML = '❌ 查無此證書（本機無核發紀錄）'; return; }
                box.innerHTML = '找到本機核發紀錄（尚未經雲端查驗）<br>證書ID：' + esc(mask(c.certId)) + '<br>學生：' + esc(mask(c.cls)) + '（座號 ' + esc(mask(c.seat)) + '）<br>' +
                    '單元：' + esc((c.units || []).join('、')) + '　最佳總分：' + esc(c.best) + '<br>核發：' + esc(c.teacher) + '（' + esc(c.at) + '）<br>驗證碼：' + esc(String(c.hash).slice(0, 12));
            }
            var q = null;
            try { q = new URLSearchParams(location.search).get('id'); } catch (e) {}
            if (q) { document.getElementById('vid').value = q; check(); }
            return { check: check };
        })();
    </script>
</body>
</html>
