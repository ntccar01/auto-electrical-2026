<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 565" font-family="Microsoft JhengHei, sans-serif">
  <style>
    .bus { stroke: #c0392b; stroke-width: 3; fill: none; }
    .sym { fill: #fff; stroke: #000; stroke-width: 2; }
    .int { fill: none; stroke: #000; stroke-width: 2; }
    .lbl { font-size: 19px; fill: #000; }
    .sml { font-size: 16px; fill: #000; }
    .pin { font-size: 17px; font-weight: bold; fill: #7d3c98; }
    .wirec { font-size: 16px; fill: #c0392b; font-weight: bold; }
    .node { fill: #000; }
    .title { font-size: 24px; font-weight: bold; fill: #1a5276; }
    .sub { font-size: 16px; fill: #5d6d7e; }
    .note { font-size: 17px; fill: #1a5276; }
  </style>

  <text x="20" y="34" class="title">喇叭系統線路圖（對照配線區佈局）</text>
  <text x="560" y="34" class="sub">電源上・搭鐵下・R=紅</text>

  <!-- 電瓶 -->
  <g>
    <rect x="50" y="290" width="60" height="100" class="sym"/>
    <text x="80" y="345" text-anchor="middle" class="lbl">電瓶</text>
    <circle cx="80" cy="290" r="4" class="node" data-node="bat_pos"/>
    <circle cx="80" cy="390" r="4" class="node" data-node="bat_neg"/>
    <line x1="80" y1="394" x2="80" y2="414" class="int"/>
    <line x1="65" y1="414" x2="95" y2="414" class="int"/>
    <line x1="70" y1="419" x2="90" y2="419" class="int"/>
    <line x1="75" y1="424" x2="85" y2="424" class="int"/>
  </g>

  <!-- 易熔絲 -->
  <g>
    <path d="M80,150 Q90,140 100,150 T120,150 T140,150 T160,150" fill="none" stroke="#000" stroke-width="4"/>
    <text x="120" y="132" text-anchor="middle" class="sml">易熔絲</text>
    <circle cx="80" cy="150" r="4" class="node" data-node="fuse_link_in"/>
    <circle cx="160" cy="150" r="4" class="node" data-node="fuse_link_out"/>
  </g>

  <!-- 保險絲 -->
  <g>
    <rect x="248" y="136" width="64" height="28" class="sym"/>
    <path d="M255,150 Q261,140 268,150 T281,150 T294,150 T305,150" fill="none" stroke="#000" stroke-width="2"/>
    <text x="280" y="128" text-anchor="middle" class="sml">保險絲 15A</text>
    <circle cx="255" cy="150" r="4" class="node" data-node="fuse_in"/>
    <circle cx="305" cy="150" r="4" class="node" data-node="fuse_out"/>
  </g>

  <!-- 繼電器 -->
  <g>
    <rect x="400" y="70" width="120" height="100" class="sym"/>
    <text x="460" y="95" text-anchor="middle" class="sml">繼電器</text>
    <line x1="395" y1="110" x2="430" y2="110" class="int"/>
    <path d="M430,110 Q435,96 440,110 Q445,124 450,110 Q455,96 460,110 Q465,124 470,110 Q475,96 480,110 Q485,124 490,110" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="490" y1="110" x2="525" y2="110" class="int"/>
    <circle cx="395" cy="110" r="4" class="node" data-node="relay_86"/>
    <circle cx="525" cy="110" r="4" class="node" data-node="relay_85"/>
    <text x="376" y="114" class="pin">86</text>
    <text x="531" y="114" class="pin">85</text>
    <line x1="395" y1="150" x2="440" y2="150" class="int"/>
    <line x1="440" y1="150" x2="485" y2="135" stroke="#000" stroke-width="2"/>
    <circle cx="440" cy="150" r="3" fill="#000"/>
    <line x1="490" y1="150" x2="525" y2="150" class="int"/>
    <circle cx="395" cy="150" r="4" class="node" data-node="relay_30"/>
    <circle cx="525" cy="150" r="4" class="node" data-node="relay_87"/>
    <text x="376" y="154" class="pin">30</text>
    <text x="531" y="154" class="pin">87</text>
  </g>

  <!-- 按鈕開關 -->
  <g>
    <rect x="650" y="80" width="80" height="60" class="sym"/>
    <line x1="645" y1="110" x2="680" y2="110" class="int"/>
    <line x1="700" y1="110" x2="750" y2="110" class="int"/>
    <line x1="680" y1="100" x2="700" y2="100" stroke="#000" stroke-width="3"/>
    <line x1="690" y1="100" x2="690" y2="90" stroke="#000" stroke-width="2"/>
    <circle cx="680" cy="110" r="3" fill="#000"/>
    <circle cx="700" cy="110" r="3" fill="#000"/>
    <circle cx="645" cy="110" r="4" class="node" data-node="btn_in"/>
    <circle cx="750" cy="110" r="4" class="node" data-node="btn_out"/>
    <text x="690" y="72" text-anchor="middle" class="sml">按鈕開關</text>
    <circle cx="750" cy="154" r="4" class="node" data-node="btn_chassis"/>
    <line x1="750" y1="158" x2="750" y2="170" class="int"/>
    <line x1="738" y1="170" x2="762" y2="170" class="int"/>
    <line x1="743" y1="175" x2="757" y2="175" class="int"/>
    <line x1="747" y1="180" x2="753" y2="180" class="int"/>
  </g>

  <!-- 上喇叭 -->
  <g>
    <path d="M670,210 L710,190 L710,270 L670,250 L650,250 L650,210 Z" class="sym"/>
    <path d="M710,210 Q730,230 710,250" fill="none" stroke="#000" stroke-width="2"/>
    <circle cx="650" cy="230" r="4" class="node" data-node="horn1_in"/>
    <text x="690" y="200" text-anchor="middle" class="sml">上喇叭</text>
    <line x1="670" y1="250" x2="670" y2="276" class="int"/>
    <circle cx="670" cy="280" r="4" class="node" data-node="horn1_gnd"/>
    <circle cx="670" cy="302" r="4" class="node" data-node="horn1_chassis"/>
    <line x1="670" y1="306" x2="670" y2="318" class="int"/>
    <line x1="658" y1="318" x2="682" y2="318" class="int"/>
    <line x1="663" y1="323" x2="677" y2="323" class="int"/>
    <line x1="667" y1="328" x2="673" y2="328" class="int"/>
  </g>

  <!-- 下喇叭 -->
  <g>
    <path d="M670,380 L710,360 L710,440 L670,420 L650,420 L650,380 Z" class="sym"/>
    <path d="M710,380 Q730,400 710,420" fill="none" stroke="#000" stroke-width="2"/>
    <circle cx="650" cy="400" r="4" class="node" data-node="horn2_in"/>
    <text x="690" y="370" text-anchor="middle" class="sml">下喇叭</text>
    <line x1="670" y1="420" x2="670" y2="446" class="int"/>
    <circle cx="670" cy="450" r="4" class="node" data-node="horn2_gnd"/>
    <circle cx="670" cy="472" r="4" class="node" data-node="horn2_chassis"/>
    <line x1="670" y1="476" x2="670" y2="488" class="int"/>
    <line x1="658" y1="488" x2="682" y2="488" class="int"/>
    <line x1="663" y1="493" x2="677" y2="493" class="int"/>
    <line x1="667" y1="498" x2="673" y2="498" class="int"/>
  </g>

  <!-- 參考配線（紅） -->
  <g>
    <line x1="80" y1="290" x2="80" y2="150" class="bus"/>
    <text x="88" y="220" class="wirec">R</text>
    <line x1="160" y1="150" x2="255" y2="150" class="bus"/>
    <line x1="305" y1="150" x2="395" y2="150" class="bus"/>
    <line x1="340" y1="150" x2="340" y2="110" class="bus"/>
    <line x1="340" y1="110" x2="395" y2="110" class="bus"/>
    <circle cx="340" cy="150" r="4" class="node"/>
    <line x1="525" y1="110" x2="645" y2="110" class="bus"/>
    <text x="580" y="102" class="wirec">R</text>
    <line x1="750" y1="110" x2="750" y2="154" class="bus"/>
    <line x1="525" y1="150" x2="600" y2="150" class="bus"/>
    <line x1="600" y1="150" x2="600" y2="400" class="bus"/>
    <line x1="600" y1="230" x2="650" y2="230" class="bus"/>
    <line x1="600" y1="400" x2="650" y2="400" class="bus"/>
    <circle cx="600" cy="230" r="4" class="node"/>
    <circle cx="600" cy="400" r="4" class="node"/>
    <text x="608" y="180" class="wirec">R</text>
    <line x1="670" y1="280" x2="670" y2="302" class="bus"/>
    <line x1="670" y1="450" x2="670" y2="472" class="bus"/>
  </g>

  <!-- 迴路說明 -->
  <text x="20" y="528" class="note">主迴路：電瓶B+ → 易熔絲 → 保險絲15A → 繼電器30 → 87 → 上/下喇叭 → 搭鐵</text>
  <text x="20" y="552" class="note">控制迴路：保險絲後 → 繼電器86 → 線圈 → 85 → 按鈕 → 搭鐵（小電流控制大電流）</text>
</svg>
