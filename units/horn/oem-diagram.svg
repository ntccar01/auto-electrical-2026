<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="Microsoft JhengHei, sans-serif">
  <style>
    .bus { stroke: #c0392b; stroke-width: 3; fill: none; }
    .ctl { stroke: #2471a3; stroke-width: 2; fill: none; }
    .gndl { stroke: #000; stroke-width: 2; fill: none; }
    .sym { fill: #fff; stroke: #000; stroke-width: 2; }
    .lbl { font-size: 13px; fill: #000; }
    .pin { font-size: 12px; font-weight: bold; fill: #7d3c98; }
    .wirec { font-size: 11px; fill: #c0392b; font-weight: bold; }
    .node { fill: #000; }
    .title { font-size: 17px; font-weight: bold; fill: #1a5276; }
    .sub { font-size: 12px; fill: #5d6d7e; }
  </style>

  <text x="20" y="28" class="title">喇叭系統線路圖（原廠手冊式）</text>
  <text x="470" y="28" class="sub">電源上・搭鐵下・R=紅 B=黑</text>

  <!-- 電瓶 -->
  <g data-node="bat">
    <rect x="20" y="60" width="60" height="90" class="sym"/>
    <text x="50" y="100" text-anchor="middle" class="lbl">電瓶</text>
    <text x="50" y="118" text-anchor="middle" class="lbl">12V</text>
    <circle cx="50" cy="60" r="4" class="node" data-node="bat_pos"/>
    <text x="58" y="56" class="pin">B+</text>
  </g>
  <!-- 電源主幹線 -->
  <line x1="50" y1="60" x2="50" y2="45" class="bus"/>
  <line x1="50" y1="45" x2="560" y2="45" class="bus"/>
  <text x="70" y="38" class="wirec">R</text>

  <!-- 易熔絲 -->
  <g data-node="fuse_link">
    <path d="M140,45 Q150,35 160,45 T180,45 T200,45" fill="none" stroke="#000" stroke-width="3"/>
    <text x="170" y="28" text-anchor="middle" class="lbl">易熔絲</text>
    <circle cx="140" cy="45" r="3" class="node" data-node="fuse_link_in"/>
    <circle cx="200" cy="45" r="3" class="node" data-node="fuse_link_out"/>
  </g>
  <!-- 保險絲 15A -->
  <g data-node="fuse">
    <rect x="250" y="32" width="44" height="26" class="sym"/>
    <text x="272" y="50" text-anchor="middle" class="lbl">15A</text>
    <text x="272" y="76" text-anchor="middle" class="lbl">保險絲</text>
    <circle cx="250" cy="45" r="3" class="node" data-node="fuse_in"/>
    <circle cx="294" cy="45" r="3" class="node" data-node="fuse_out"/>
  </g>

  <!-- 繼電器 -->
  <g data-node="relay">
    <rect x="330" y="110" width="130" height="150" class="sym"/>
    <text x="395" y="130" text-anchor="middle" class="lbl">繼電器</text>
    <!-- 線圈 86-85 -->
    <path d="M340,160 Q350,148 360,160 Q370,172 380,160 Q390,148 400,160 Q410,172 420,160" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="330" y1="160" x2="340" y2="160" class="ctl"/>
    <line x1="420" y1="160" x2="460" y2="160" class="ctl"/>
    <circle cx="330" cy="160" r="4" class="node" data-node="relay_86"/>
    <circle cx="460" cy="160" r="4" class="node" data-node="relay_85"/>
    <text x="312" y="164" class="pin">86</text>
    <text x="466" y="164" class="pin">85</text>
    <!-- 開關 30-87 -->
    <line x1="330" y1="220" x2="375" y2="220" class="bus"/>
    <line x1="415" y1="205" x2="460" y2="220" stroke="#000" stroke-width="2"/>
    <circle cx="375" cy="220" r="2.5" fill="#000"/>
    <line x1="415" y1="220" x2="460" y2="220" class="bus"/>
    <circle cx="330" cy="220" r="4" class="node" data-node="relay_30"/>
    <circle cx="460" cy="220" r="4" class="node" data-node="relay_87"/>
    <text x="312" y="224" class="pin">30</text>
    <text x="466" y="224" class="pin">87</text>
  </g>
  <!-- 電源分支：保險絲後 → 30 / 86 -->
  <line x1="294" y1="45" x2="330" y2="45" class="bus"/>
  <line x1="330" y1="45" x2="330" y2="220" class="bus"/>
  <circle cx="330" cy="45" r="3" class="node"/>
  <text x="300" y="38" class="wirec">R</text>
  <line x1="294" y1="45" x2="500" y2="45" class="bus"/>
  <line x1="500" y1="45" x2="500" y2="160" class="bus"/>
  <line x1="460" y1="160" x2="500" y2="160" class="ctl"/>
  <circle cx="500" cy="45" r="3" class="node"/>

  <!-- 87 → 喇叭 -->
  <line x1="460" y1="220" x2="540" y2="220" class="bus"/>
  <line x1="540" y1="220" x2="540" y2="300" class="bus"/>
  <line x1="500" y1="300" x2="580" y2="300" class="bus"/>
  <circle cx="540" cy="220" r="3" class="node"/>
  <text x="470" y="212" class="wirec">R</text>

  <!-- 上喇叭 H -->
  <g data-node="horn1">
    <path d="M500,300 L530,285 L530,345 L500,330 Z" class="sym"/>
    <text x="515" y="322" text-anchor="middle" class="lbl">H</text>
    <circle cx="500" cy="315" r="4" class="node" data-node="horn1_in"/>
    <line x1="515" y1="330" x2="515" y2="360" class="gndl"/>
    <circle cx="515" cy="360" r="4" class="node" data-node="horn1_gnd"/>
    <line x1="515" y1="364" x2="515" y2="376" class="gndl"/>
    <line x1="503" y1="376" x2="527" y2="376" class="gndl"/>
    <line x1="507" y1="381" x2="523" y2="381" class="gndl"/>
    <line x1="511" y1="386" x2="519" y2="386" class="gndl"/>
  </g>
  <!-- 下喇叭 L -->
  <g data-node="horn2">
    <path d="M550,300 L580,285 L580,345 L550,330 Z" class="sym"/>
    <text x="565" y="322" text-anchor="middle" class="lbl">L</text>
    <circle cx="580" cy="315" r="4" class="node" data-node="horn2_in"/>
    <line x1="565" y1="330" x2="565" y2="360" class="gndl"/>
    <circle cx="565" cy="360" r="4" class="node" data-node="horn2_gnd"/>
    <line x1="565" y1="364" x2="565" y2="376" class="gndl"/>
    <line x1="553" y1="376" x2="577" y2="376" class="gndl"/>
    <line x1="557" y1="381" x2="573" y2="381" class="gndl"/>
    <line x1="561" y1="386" x2="569" y2="386" class="gndl"/>
  </g>
  <line x1="580" y1="315" x2="580" y2="300" class="bus"/>
  <line x1="540" y1="300" x2="580" y2="300" class="bus"/>

  <!-- 按鈕開關（85 → 按鈕 → 搭鐵） -->
  <g data-node="button">
    <rect x="500" y="110" width="80" height="44" class="sym"/>
    <line x1="500" y1="132" x2="525" y2="132" class="ctl"/>
    <line x1="555" y1="132" x2="580" y2="132" class="ctl"/>
    <circle cx="525" cy="132" r="2.5" fill="#000"/>
    <circle cx="555" cy="132" r="2.5" fill="#000"/>
    <line x1="530" y1="122" x2="550" y2="122" stroke="#000" stroke-width="3"/>
    <circle cx="500" cy="132" r="4" class="node" data-node="btn_in"/>
    <circle cx="580" cy="132" r="4" class="node" data-node="btn_out"/>
    <text x="540" y="105" text-anchor="middle" class="lbl">喇叭按鈕</text>
  </g>
  <line x1="460" y1="160" x2="460" y2="132" class="ctl"/>
  <line x1="460" y1="132" x2="500" y2="132" class="ctl"/>
  <text x="466" y="148" class="wirec">B</text>
  <line x1="580" y1="132" x2="600" y2="132" class="ctl"/>
  <line x1="600" y1="132" x2="600" y2="180" class="ctl"/>
  <circle cx="600" cy="180" r="4" class="node" data-node="btn_chassis"/>
  <line x1="600" y1="184" x2="600" y2="196" class="gndl"/>
  <line x1="588" y1="196" x2="612" y2="196" class="gndl"/>
  <line x1="592" y1="201" x2="608" y2="201" class="gndl"/>
  <line x1="596" y1="206" x2="604" y2="206" class="gndl"/>

  <!-- 電瓶負極搭鐵 -->
  <line x1="50" y1="150" x2="50" y2="170" class="gndl"/>
  <circle cx="50" cy="150" r="4" class="node" data-node="bat_neg"/>
  <line x1="38" y1="170" x2="62" y2="170" class="gndl"/>
  <line x1="42" y1="175" x2="58" y2="175" class="gndl"/>
  <line x1="46" y1="180" x2="54" y2="180" class="gndl"/>
  <text x="50" y="198" text-anchor="middle" class="sub">車身搭鐵（全車導通）</text>

  <!-- 迴路說明 -->
  <text x="20" y="420" class="sub">主迴路：電瓶B+ → 易熔絲 → 保險絲15A → 繼電器30 → 87 → 上/下喇叭 → 搭鐵</text>
  <text x="20" y="442" class="sub">控制迴路：保險絲後 → 繼電器86 → 線圈 → 85 → 按鈕 → 搭鐵（小電流控制大電流）</text>
</svg>
